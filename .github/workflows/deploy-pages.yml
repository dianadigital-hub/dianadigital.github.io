name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Verify TypeScript Types
        run: npm run typecheck
        working-directory: site
      - name: Build Single-File Distribution
        run: npm run build
        working-directory: site
        env:
          VITE_DEPLOY_BASE: /
          # Public form IDs also appear in the browser bundle; no credentials.
          VITE_FORMSPREE_CONTACT_ID: ${{ vars.VITE_FORMSPREE_CONTACT_ID || secrets.VITE_FORMSPREE_CONTACT_ID || 'xjyvvjoz' }}
          VITE_FORMSPREE_FEEDBACK_ID: ${{ vars.VITE_FORMSPREE_FEEDBACK_ID || secrets.VITE_FORMSPREE_FEEDBACK_ID || 'xqpkkwlr' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow: meldet Bing (und Yandex, Seznam …) nach jedem Deploy, dass sich die Seite geändert hat.
      # Der Schlüssel ist absichtlich öffentlich, er liegt als Datei unter /48f1c414bef50781cca834ac424a02f2.txt.
      - name: IndexNow ping
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"www.dianadigital.de","key":"48f1c414bef50781cca834ac424a02f2","keyLocation":"https://www.dianadigital.de/48f1c414bef50781cca834ac424a02f2.txt","urlList":["https://www.dianadigital.de/","https://www.dianadigital.de/llms.txt"]}'
